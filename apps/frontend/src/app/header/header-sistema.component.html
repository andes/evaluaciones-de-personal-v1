<div class="header-sistema py-3 mb-4 position-relative">

    <!-- Botón volver al menú -->
    <button class="btn-menu-home" [routerLink]="['/menu']" title="Ir al menú principal">
        <i class="bi bi-house-door-fill"></i>
    </button>

    <div class="text-center">

        <h1 class="titulo-sistema mb-2">
            <i class="bi bi-clipboard-check me-2"></i>
            Sistema de Evaluaciones
        </h1>

        <div class="usuario-box d-inline-flex align-items-center">

            <i class="bi bi-person-circle icono-usuario me-2"></i>

            <div>
                <div class="usuario-nombre">
                    {{ nombreUsuario }}
                </div>

                <div class="usuario-rol">
                    {{ rolUsuario }}
                </div>
            </div>

        </div>

    </div>

</div>
