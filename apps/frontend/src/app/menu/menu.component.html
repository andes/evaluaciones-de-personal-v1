<section class="menu section py-5">

    <div class="container mb-5">

        <div class="text-center mb-3">

            <h2 class="mb-1">Menú</h2>

            <div class="user-info d-flex justify-content-center align-items-center small text-muted">

                <i class="bi bi-person-circle fs-5 me-1"></i>

                <span class="fw-bold me-1">Usuario:</span>

                <span>{{ nombreUsuario }}</span>

                <span class="ms-2 badge bg-secondary">
                    {{ rolUsuario }}
                </span>

            </div>

        </div>

    </div>

    <div class="row justify-content-center g-4">

        <div class="col-lg-4 col-md-6" *ngFor="let bloque of menuVisible">

            <div class="card menu-item h-100 p-3">

                <div class="d-flex align-items-center mb-2">

                    <i [class]="bloque.icono + ' fs-3 me-2 text-primary'">
                    </i>

                    <h4 class="mb-0">
                        {{ bloque.titulo }}
                    </h4>

                </div>

                <hr class="menu-separador">

                <ul class="list-unstyled ps-3">

                    <li *ngFor="let opcion of bloque.opciones">

                        <a [routerLink]="[opcion.ruta]" class="text-decoration-none d-block py-1">

                            {{ opcion.texto }}

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </div>

</section>
